<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Sarana</title>
<style>
  :root{
    --ink:#0d4a5c;
    --ink-soft:#1a7f96;
    --paper:#eef6f7;
    --paper-card:#ffffff;
    --line:#cfe6ea;
    --amber:#c9800a;
    --amber-bg:#fdecc8;
    --green:#3f7358;
    --green-bg:#dcebe2;
    --blue:#1a7f96;
    --blue-bg:#d7edf1;
    --red:#c1392b;
    --red-bg:#f8ddd8;
    --gold:#f2a900;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Source Serif Pro',serif;
    background:var(--paper);
    color:var(--ink);
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3{font-family:'Georgia','Source Serif Pro',serif;margin:0 0 4px;font-weight:600;}
  a{color:var(--ink-soft);}
  button{
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper-card);
    border-radius:var(--radius);
    padding:9px 16px;
    font-size:14px;
  }
  button.secondary{background:transparent;color:var(--ink);}
  button.ghost{border:none;background:none;color:var(--ink-soft);padding:6px 10px;}
  button.danger{background:var(--red);border-color:var(--red);}
  input,select,textarea{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  label{font-size:12.5px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:block;margin-bottom:4px;}

  /* Login */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;
    padding:36px 30px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 1px 3px rgba(27,42,65,.08);
  }
  .login-box h1{font-size:26px;margin-bottom:2px;}
  .login-box .logo-img{height:88px;width:88px;margin-bottom:14px;}
  .login-box p.sans{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
  .login-box input{text-align:center;letter-spacing:2px;margin-bottom:12px;}
  .login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;}

  /* App shell */
  #app{display:none;}
  header.topbar{
    background:var(--ink);color:var(--paper-card);
    padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  header.topbar h1{color:#fff;font-size:20px;}
  header.topbar .sub{font-family:inherit;font-size:12px;color:#c9d3e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
  nav.tabs{
    display:flex;gap:2px;background:var(--paper-card);border-bottom:1px solid var(--line);
    padding:0 16px;overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--ink-soft);border-radius:0;
    padding:14px 16px;font-size:13.5px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom:2px solid var(--gold);font-weight:600;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .logo-img{height:44px;width:44px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .topbar .brand{display:flex;align-items:center;gap:12px;}

  .card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;
    border-bottom:1px solid var(--line);padding:8px 10px;
  }
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#faf8f2;}
  .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--line);display:block;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .badge.dipinjam{background:var(--amber-bg);color:var(--amber);}
  .badge.kembali{background:var(--green-bg);color:var(--green);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;}

  .recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .recap-item{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .recap-item .num{font-size:28px;font-weight:700;}
  .recap-item .label{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;color:var(--ink-soft);}

  .period-toggle{display:flex;gap:0;border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden;width:fit-content;}
  .period-toggle button{border:none;border-radius:0;background:transparent;color:var(--ink);padding:8px 18px;font-size:13px;}
  .period-toggle button.active{background:var(--ink);color:#fff;}
  .section-title{font-size:14px;margin:22px 0 10px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;}

  /* Modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(27,42,65,.45);
    align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;
  }
  .overlay.active{display:flex;}
  .modal{background:var(--paper-card);border-radius:10px;max-width:520px;width:100%;padding:22px;}
  .modal h2{font-size:19px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .photo-block{border:1px solid var(--line);border-radius:8px;padding:12px;background:#faf8f2;}
  .photo-block .sub-label{font-size:12px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:10px 0 6px;}
  .photo-block .sub-label:first-child{margin-top:0;}
  .paste-zone{
    border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12.5px;color:var(--ink-soft);
    background:#fff;cursor:text;
  }
  .preview-wrap{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
  .preview-item{position:relative;width:70px;height:70px;}
  .preview-item img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .preview-item .remove-x{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--red);color:#fff;border:2px solid var(--paper-card);font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
  }
  .link-chip-row{display:flex;gap:6px;}
  .thumb-stack{position:relative;width:40px;height:40px;}
  .thumb-count{
    position:absolute;bottom:-4px;right:-4px;background:var(--ink);color:#fff;font-size:9px;
    border-radius:8px;padding:1px 4px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .export-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .export-btns button{font-size:12.5px;padding:7px 12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .status-msg{font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin-top:6px;min-height:16px;}
  .status-msg.err{color:var(--red);}
  .status-msg.ok{color:var(--green);}

  @media(max-width:640px){
    table thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 4px;}
    tbody td{border:none;padding:4px 10px;}
    tbody td:before{content:attr(data-label);font-weight:600;color:var(--ink-soft);display:inline-block;min-width:90px;font-size:11px;}
  }
</style>
</head>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Sarana</title>
<style>
  :root{
    --ink:#0d4a5c;
    --ink-soft:#1a7f96;
    --paper:#eef6f7;
    --paper-card:#ffffff;
    --line:#cfe6ea;
    --amber:#c9800a;
    --amber-bg:#fdecc8;
    --green:#3f7358;
    --green-bg:#dcebe2;
    --blue:#1a7f96;
    --blue-bg:#d7edf1;
    --red:#c1392b;
    --red-bg:#f8ddd8;
    --gold:#f2a900;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia','Source Serif Pro',serif;
    background:var(--paper);
    color:var(--ink);
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3{font-family:'Georgia','Source Serif Pro',serif;margin:0 0 4px;font-weight:600;}
  a{color:var(--ink-soft);}
  button{
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper-card);
    border-radius:var(--radius);
    padding:9px 16px;
    font-size:14px;
  }
  button.secondary{background:transparent;color:var(--ink);}
  button.ghost{border:none;background:none;color:var(--ink-soft);padding:6px 10px;}
  button.danger{background:var(--red);border-color:var(--red);}
  input,select,textarea{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  label{font-size:12.5px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:block;margin-bottom:4px;}

  /* Login */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;
    padding:36px 30px;max-width:340px;width:100%;text-align:center;
    box-shadow:0 1px 3px rgba(27,42,65,.08);
  }
  .login-box h1{font-size:26px;margin-bottom:2px;}
  .login-box .logo-img{height:88px;width:88px;margin-bottom:14px;}
  .login-box p.sans{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
  .login-box input{text-align:center;letter-spacing:2px;margin-bottom:12px;}
  .login-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;}

  /* App shell */
  #app{display:none;}
  header.topbar{
    background:var(--ink);color:var(--paper-card);
    padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  header.topbar h1{color:#fff;font-size:20px;}
  header.topbar .sub{font-family:inherit;font-size:12px;color:#c9d3e0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
  nav.tabs{
    display:flex;gap:2px;background:var(--paper-card);border-bottom:1px solid var(--line);
    padding:0 16px;overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--ink-soft);border-radius:0;
    padding:14px 16px;font-size:13.5px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    border-bottom:2px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom:2px solid var(--gold);font-weight:600;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .logo-img{height:44px;width:44px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .topbar .brand{display:flex;align-items:center;gap:12px;}

  .card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > div{flex:1;min-width:150px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:600;
    border-bottom:1px solid var(--line);padding:8px 10px;
  }
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#faf8f2;}
  .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--line);display:block;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .badge.dipinjam{background:var(--amber-bg);color:var(--amber);}
  .badge.kembali{background:var(--green-bg);color:var(--green);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;}

  .recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .recap-item{background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .recap-item .num{font-size:28px;font-weight:700;}
  .recap-item .label{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px;color:var(--ink-soft);}

  .period-toggle{display:flex;gap:0;border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden;width:fit-content;}
  .period-toggle button{border:none;border-radius:0;background:transparent;color:var(--ink);padding:8px 18px;font-size:13px;}
  .period-toggle button.active{background:var(--ink);color:#fff;}
  .section-title{font-size:14px;margin:22px 0 10px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;}

  /* Modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(27,42,65,.45);
    align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;
  }
  .overlay.active{display:flex;}
  .modal{background:var(--paper-card);border-radius:10px;max-width:520px;width:100%;padding:22px;}
  .modal h2{font-size:19px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .photo-block{border:1px solid var(--line);border-radius:8px;padding:12px;background:#faf8f2;}
  .photo-block .sub-label{font-size:12px;color:var(--ink-soft);font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:10px 0 6px;}
  .photo-block .sub-label:first-child{margin-top:0;}
  .paste-zone{
    border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12.5px;color:var(--ink-soft);
    background:#fff;cursor:text;
  }
  .preview-wrap{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
  .preview-item{position:relative;width:70px;height:70px;}
  .preview-item img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .preview-item .remove-x{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--red);color:#fff;border:2px solid var(--paper-card);font-size:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;
  }
  .link-chip-row{display:flex;gap:6px;}
  .thumb-stack{position:relative;width:40px;height:40px;}
  .thumb-count{
    position:absolute;bottom:-4px;right:-4px;background:var(--ink);color:#fff;font-size:9px;
    border-radius:8px;padding:1px 4px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .export-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .export-btns button{font-size:12.5px;padding:7px 12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .status-msg{font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin-top:6px;min-height:16px;}
  .status-msg.err{color:var(--red);}
  .status-msg.ok{color:var(--green);}

  @media(max-width:640px){
    table thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 4px;}
    tbody td{border:none;padding:4px 10px;}
    tbody td:before{content:attr(data-label);font-weight:600;color:var(--ink-soft);display:inline-block;min-width:90px;font-size:11px;}
  }
</style>
</head>
